<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#030611"/>
    </linearGradient>

    <radialGradient id="glow-cyan" cx="250" cy="120" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-purple" cx="950" cy="220" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#c084fc" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="text-title-grad" x1="200" y1="120" x2="700" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e0f2fe"/>
      <stop offset="85%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="badge-grad" x1="0" y1="0" x2="280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="laser-line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.06"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 58px;
      letter-spacing: -1.5px;
      fill: url(#text-title-grad);
    }
    .subtitle {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 21px;
      fill: #94a3b8;
      letter-spacing: -0.2px;
    }
    .badge-text {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-weight: 600;
      font-size: 12.5px;
      fill: #38bdf8;
      letter-spacing: 2px;
    }
    .pill-text {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-weight: 500;
      font-size: 12.5px;
      fill: #cbd5e1;
    }
    .code-accent {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 13px;
      fill: #818cf8;
      opacity: 0.85;
    }
    .pulse-node {
      animation: pulse 3s infinite alternate;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="380" rx="16" fill="url(#tech-grid)" />

  <!-- Ambient Glows -->
  <circle cx="250" cy="120" r="320" fill="url(#glow-cyan)" />
  <circle cx="980" cy="220" r="360" fill="url(#glow-purple)" />

  <!-- Outer Card Border -->
  <rect x="1.5" y="1.5" width="1197" height="377" rx="14.5" fill="none" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Top Laser Glow Line -->
  <rect x="100" y="2" width="1000" height="1.5" fill="url(#laser-line)" filter="url(#glow-filter)" />

  <!-- Neural Network Constellation (Right Side Decoration) -->
  <g opacity="0.65" transform="translate(180, 0)">
    <!-- Connections -->
    <line x1="720" y1="110" x2="820" y2="80" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="4,4"/>
    <line x1="820" y1="80" x2="930" y2="130" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.2"/>
    <line x1="820" y1="80" x2="880" y2="210" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.2"/>
    <line x1="720" y1="110" x2="770" y2="220" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.2"/>
    <line x1="770" y1="220" x2="880" y2="210" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.2"/>
    <line x1="880" y1="210" x2="930" y2="130" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="880" y1="210" x2="850" y2="290" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.2"/>
    <line x1="770" y1="220" x2="720" y2="300" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1.2"/>

    <!-- Nodes with Glow -->
    <circle cx="820" cy="80" r="5" fill="#38bdf8" filter="url(#glow-filter)" />
    <circle cx="820" cy="80" r="3" fill="#ffffff" />
    
    <circle cx="720" cy="110" r="4" fill="#818cf8" />
    <circle cx="930" cy="130" r="6" fill="#c084fc" filter="url(#glow-filter)" />
    <circle cx="930" cy="130" r="3.5" fill="#ffffff" />

    <circle cx="880" cy="210" r="7" fill="#38bdf8" filter="url(#glow-filter)" />
    <circle cx="880" cy="210" r="4" fill="#ffffff" />

    <circle cx="770" cy="220" r="4" fill="#818cf8" />
    <circle cx="850" cy="290" r="4.5" fill="#38bdf8" />
    <circle cx="720" cy="300" r="3.5" fill="#c084fc" />

    <!-- Concentric Ring Target on Key Node -->
    <circle cx="880" cy="210" r="16" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2,3"/>
    <circle cx="880" cy="210" r="26" fill="none" stroke="#818cf8" stroke-opacity="0.15" stroke-width="1"/>
  </g>

  <!-- Left Content Block -->
  <!-- Top Status Badge -->
  <g transform="translate(80, 56)">
    <rect width="320" height="32" rx="16" fill="url(#badge-grad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#38bdf8" filter="url(#glow-filter)"/>
    <circle cx="18" cy="16" r="2.5" fill="#ffffff"/>
    <text x="32" y="20.5" class="badge-text">AI RESEARCH &amp; GENAI ARCHITECT</text>
  </g>

  <!-- Name / Main Title -->
  <text x="80" y="152" class="title">AGGREEM GUPTA</text>

  <!-- Subtitle -->
  <text x="82" y="196" class="subtitle">B.Tech in Artificial Intelligence + Mini MBA • <tspan fill="#38bdf8">Zenith School of AI</tspan></text>

  <!-- Description / Passion -->
  <text x="82" y="234" class="code-accent">&gt; Specializing in RAG Architectures • Vector Search • Multimodal GenAI</text>

  <!-- Bottom Interactive Tech Pills -->
  <g transform="translate(80, 276)">
    <!-- Pill 1: CampusBrain -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
      <text x="18" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14">🧠</text>
      <text x="44" y="23.5" class="pill-text">CampusBrain</text>
    </g>

    <!-- Pill 2: CompanyBrain -->
    <g transform="translate(196, 0)">
      <rect width="190" height="38" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1"/>
      <text x="18" y="24" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="14">🏢</text>
      <text x="44" y="23.5" class="pill-text">CompanyBrain</text>
    </g>

    <!-- Pill 3: LearnMate -->
    <g transform="translate(402, 0)">
      <rect width="175" height="38" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1"/>
      <text x="18" y="24" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="14">📚</text>
      <text x="44" y="23.5" class="pill-text">LearnMate</text>
    </g>

    <!-- Pill 4: Stack highlight -->
    <g transform="translate(593, 0)">
      <rect width="210" height="38" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <text x="18" y="24" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="14">⚡</text>
      <text x="44" y="23.5" class="pill-text">Python • RAG • Vector</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="80" y1="345" x2="1120" y2="345" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1"/>
</svg>
